[project]
name = "kuulo-ml"
version = "0.1.0"
description = "Kuulo Step B: licensed datasets, YAMNet embeddings, trained head, evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kuulo-node",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "skl2onnx>=1.17",
    "onnxruntime>=1.19",
]

[project.scripts]
kuulo-ml = "kuulo_ml.cli:main"

[tool.uv.sources]
kuulo-node = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuulo_ml"]
