# Kuulo node demo config. `make node` copies this to node/config.local.toml (gitignored);
# edit the local copy, not this file. Relative paths are relative to this file.

node_id = "demo-laptop"
server_url = "http://127.0.0.1:8000"
time_quality = "ntp"
key_file = "demo-laptop.key"
model_path = "../data/models/yamnet.tflite"
class_map_path = "../data/models/yamnet_class_map.csv"
# "auto": Step B (trained head, `make ml`) when data/models/drone_head.onnx exists, else Step A
# (YAMNet class scores, the [weights] below) with a warning. "head" or "yamnet" force one.
classifier = "auto"
head_path = "../data/models/drone_head.onnx"
# Outbox (unsent messages) and feature traces. Inside data/, which git ignores.
state_dir = "../data/node-state/demo-laptop"

# Reported sensor position. Demo value: University of Helsinki main building,
# city centre campus. Never commit a real node location.
[location]
lat = 60.1694
lon = 24.9490
accuracy_m = 50

[detection]
threshold = 0.5
k = 3
n = 5
end_after_s = 5.0
update_every_s = 5.0

# drone score = max over classes of (weight x YAMNet score). Keys are AudioSet class names.
[weights]
"Propeller, airscrew" = 1.0
"Helicopter" = 0.8
"Aircraft" = 0.6
"Aircraft engine" = 0.6

# Feature traces (coarse 32-band spectra, never audio) recorded during detections.
# Defaults shown; uncomment a [traces] table to change them.
# [traces]
# enabled = true
# budget_mb = 500           # local disk budget, least valuable traces evicted first
# upload_mb_per_day = 50    # for auto-push and hard-negative samples; server requests bypass it
# sample_rate = 0.01        # share of uncorroborated detections uploaded as hard negatives
