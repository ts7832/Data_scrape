[project]
name = "kuulo-node"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kuulo-protocol",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "ai-edge-litert>=1.2",
    "onnxruntime>=1.19",
]

[project.scripts]
kuulo-node = "kuulo_node.cli:main"

[tool.uv.sources]
kuulo-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuulo_node"]
