[project]
name = "kuulo"
version = "0.1.0"
description = "Civic acoustic drone-detection network"
requires-python = ">=3.12,<3.13"
dependencies = ["kuulo-protocol", "kuulo-server"]

[tool.uv]
package = false

[tool.uv.sources]
kuulo-protocol = { workspace = true }
kuulo-server = { workspace = true }

[tool.uv.workspace]
members = ["protocol", "server"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["protocol/tests", "server/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kuulo_protocol", "kuulo_server", "kuulo_sim"]
