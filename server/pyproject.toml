[project]
name = "kuulo-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kuulo-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
]

[tool.uv.sources]
kuulo-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuulo_server"]
